<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Třídění do 4 rohů</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #f0f9ff;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
            touch-action: none; 
        }

        /* --- STYLY PRO HERNÍ PRVKY --- */
        #gameArea {
            display: none; /* Skryté, dokud není na šířku */
            width: 100%;
            height: 100%;
            position: relative;
        }

        .item {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            position: fixed;
            touch-action: none;
            cursor: grab;
            z-index: 10;
            transition: transform 0.1s ease; /* Jemný efekt při zvednutí */
        }

        .item:active {
            transform: scale(1.1);
            cursor: grabbing;
        }

        .box {
            position: fixed;
            width: 110px;
            height: 110px;
            border-radius: 20px;
            border: 4px dashed rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            transition: transform 0.2s ease;
            z-index: 1;
        }

        /* Umístění do 4 rohů */
        .top-left     { top: 15px; left: 15px; }
        .top-right    { top: 15px; right: 15px; }
        .bottom-left  { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }

        /* Barevné varianty */
        .red    { background-color: #ff6b6b; border-color: #c92a2a; }
        .blue   { background-color: #4dabf7; border-color: #1864ab; }
        .green  { background-color: #51cf66; border-color: #2b8a3e; }
        .yellow { background-color: #fcc419; border-color: #e67700; }

        /* --- VÝZVA K OTOČENÍ --- */
        #rotateMessage {
            display: none;
            position: fixed;
            inset: 0;
            background-color: #f0f9ff;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 24px;
            padding: 20px;
        }

        /* Detekce orientace - pokud je PORTRAIT (na výšku) */
        @media (orientation: portrait) {
            #rotateMessage { display: flex; }
            #gameArea { display: none !important; } /* Vynutíme skrytí hry */
        }

        /* Detekce orientace - pokud je LANDSCAPE (na šířku) */
        @media (orientation: landscape) {
            #gameArea { display: block; }
        }

        /* Vítězná obrazovka */
        .win-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            text-align: center;
            gap: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Výzva k otočení -->
    <div id="rotateMessage">
        <div style="font-size: 80px; margin-bottom: 20px;">🔄📱</div>
        <p>Otoč prosím telefon na šířku</p>
        <p style="font-size: 16px; color: #777; margin-top: 10px;">(Ujisti se, že nemáš zamknuté otáčení v telefonu)</p>
    </div>

    <!-- Samotná herní oblast, která se skryje, pokud je telefon na výšku -->
    <div id="gameArea">
        <div class="box red top-left" data-color="red">📦</div>
        <div class="box blue top-right" data-color="blue">📦</div>
        <div class="box green bottom-left" data-color="green">📦</div>
        <div class="box yellow bottom-right" data-color="yellow">📦</div>

        <div class="win-screen" id="winScreen">
            🌟 Skvělá práce! 🌟
            <div style="font-size: 80px;">😴</div>
            <p style="font-size: 18px; color: #555;">Hračky jdou spát...</p>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const winScreen = document.getElementById('winScreen');
        const boxes = document.querySelectorAll('.box');

        const itemsData = [
            { color: 'red', emoji: '🍎' },
            { color: 'blue', emoji: '🫐' },
            { color: 'green', emoji: '🥦' },
            { color: 'yellow', emoji: '🍌' },
            { color: 'red', emoji: '🍓' },
            { color: 'blue', emoji: '🐟' }
        ];

        let currentIndex = 0;
        let gameStarted = false; // Příznak, zda už hra běží

        // Funkce, která spočítá bezpečnou náhodnou pozici ve viditelném LANDSCAPE středu
        function calculateSafeRandomPosition() {
            // Použijeme clientWidth/Height, které odpovídají viditelné ploše
            const width = window.innerWidth;
            const height = window.innerHeight;

            // Definujeme bezpečný obdélník uprostřed (např. vnitřních 50% šířky a 40% výšky)
            const safeWidth = width * 0.5;
            const safeHeight = height * 0.4;

            // Náhodný bod X a Y uvnitř tohoto bezpečného obdélníku
            const randomX = (width - safeWidth) / 2 + Math.random() * safeWidth;
            const randomY = (height - safeHeight) / 2 + Math.random() * safeHeight;

            // Odečteme polovinu velikosti předmětu (45px), abychom centrovali na střed předmětu
            return {
                x: Math.floor(randomX - 45),
                y: Math.floor(randomY - 45)
            };
        }

        function createNextItem() {
            // Pokud telefon není na šířku, předmět nevytvoříme
            if (window.innerHeight > window.innerWidth) return;

            if (currentIndex >= itemsData.length) {
                winScreen.style.display = 'flex';
                return;
            }

            // Odstraníme případný starý předmět (pokud zbyl z minula)
            const oldItem = document.querySelector('.item');
            if (oldItem) oldItem.remove();

            const data = itemsData[currentIndex];
            const item = document.createElement('div');
            item.className = `item ${data.color}`;
            item.innerText = data.emoji;
            item.dataset.color = data.color;

            // Vypočítáme náhodnou pozici
            const pos = calculateSafeRandomPosition();
            item.style.left = `${pos.x}px`;
            item.style.top = `${pos.y}px`;

            // Předmět vkládáme do gameArea, aby se skryl s ním
            gameArea.appendChild(item);
            initDrag(item);
        }

        function initDrag(element) {
            let isDragging = false;
            let offsetX, offsetY;

            element.addEventListener('pointerdown', (e) => {
                isDragging = true;
                element.setPointerCapture(e.pointerId);
                const rect = element.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                element.style.transition = 'none';
            });

            element.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const x = e.clientX - offsetX;
                const y = e.clientY - offsetY;
                element.style.left = `${x}px`;
                element.style.top = `${y}px`;
            });

            element.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;

                const itemRect = element.getBoundingClientRect();
                let droppedCorrectly = false;

                boxes.forEach(box => {
                    const boxRect = box.getBoundingClientRect();
                    
                    const isOverlapping = !(
                        itemRect.right < boxRect.left ||
                        itemRect.left > boxRect.right ||
                        itemRect.bottom < boxRect.top ||
                        itemRect.top > boxRect.bottom
                    );

                    if (isOverlapping && box.dataset.color === element.dataset.color) {
                        droppedCorrectly = true;
                        box.style.transform = 'scale(1.25)';
                        setTimeout(() => box.style.transform = 'scale(1)', 200);
                    }
                });

                if (droppedCorrectly) {
                    element.remove();
                    currentIndex++;
                    createNextItem();
                }
            });
        }

        // HLÍDAČ ORIENTACE: Funkce, která kontroluje, zda můžeme spustit hru
        function checkOrientationAndStart() {
            // Je telefon na šířku? (šířka je větší než výška)
            if (window.innerWidth > window.innerHeight) {
                // Pokud hra ještě neběžela, spustíme první předmět
                if (!gameStarted) {
                    gameStarted = true;
                    // Krátká pauza, aby se CSS stihlo překreslit
                    setTimeout(createNextItem, 100); 
                } else {
                    // Hra už běžela, ale možná syn otočil tam a zpět.
                    // Pokud na obrazovce není předmět, vytvoříme ho (opravíme pozici).
                    if (!document.querySelector('.item') && currentIndex < itemsData.length) {
                        createNextItem();
                    }
                }
            }
            // Pokud je na výšku (portrait), CSS (#gameArea { display: none }) se postará o schování.
        }

        // Posloucháme změnu velikosti okna (otočení)
        window.addEventListener('resize', checkOrientationAndStart);

        // První kontrola při načtení stránky
        checkOrientationAndStart();
    </script>
</body>
</html>
